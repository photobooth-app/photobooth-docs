name: Build and Publish docs
on:
    push:
        branches:
            - main
permissions:
    contents: write
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  lfs: true

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm # or pnpm / yarn
            - name: Cache VitePress
              uses: actions/cache@v6
              with:
                  path: .vitepress/cache
                  key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'bun.lockb') }}
                  restore-keys: |
                      ${{ runner.os }}-vitepress-

            - name: Install dependencies
              run: npm ci # ci=clean install

            - name: Build with VitePress
              run: npm run docs:build

            - name: 📂 upload files
              uses: SamKirkland/FTP-Deploy-Action@v4.4.0
              with:
                  server: photobooth-app.org.w01b6f5a.kasserver.com
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: ".vitepress/dist/"
                  # dry-run: true
